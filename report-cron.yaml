# Agendamento diário às 22h de Belém (01:00 UTC do dia seguinte).
# Configurar as três credenciais SMTP no Render antes de aplicar este Blueprint.
services:
  - type: cron
    name: l2-one-relatorio-diario
    runtime: python
    plan: starter
    schedule: "0 1 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python daily_report.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: l2-one-db
          property: connectionString
      - key: L2_SMTP_HOST
        sync: false
      - key: L2_SMTP_PORT
        value: "465"
      - key: L2_SMTP_USER
        sync: false
      - key: L2_SMTP_PASSWORD
        sync: false
