name: Busca indexada PostgreSQL
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: l2test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: l2_one_next_staging_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Testar busca e índice no PostgreSQL
        env:
          L2_SEARCH_TEST_DSN: postgresql://l2test:local-test-only@localhost:5432/l2_one_next_staging_db
        run: python -m unittest discover -s tests -p 'test_global_search_pg.py' -v
