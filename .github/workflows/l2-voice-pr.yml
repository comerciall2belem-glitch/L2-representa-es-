name: L2 One - Gate Voz PWA
on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-voice-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validar sintaxe
        id: syntax
        run: |
          node --check app.js
          node --check sw.js
      - name: Testes e contextos
        id: voice
        run: node --test tests/l2-voice-input-controller.test.cjs
      - name: Validar versão do cache
        id: cache
        run: |
          node -e 'const fs=require("node:fs");const html=fs.readFileSync("index.html","utf8");const sw=fs.readFileSync("sw.js","utf8");const path=html.match(/src="(app\.js\?v=[^"]+)"/)?.[1];if(!path||!sw.includes("/"+path)||!sw.includes("l2-one-v140-voice-fallback"))process.exit(1)'
      - name: Resumo
        if: always()
        env:
          SYNTAX: ${{ steps.syntax.outcome }}
          VOICE: ${{ steps.voice.outcome }}
          CACHE: ${{ steps.cache.outcome }}
        run: |
          {
            echo "## Gate de voz L2 One"
            echo "- Sintaxe: $SYNTAX"
            echo "- Testes e quatro contextos: $VOICE"
            echo "- Cache PWA: $CACHE"
            if [ "$SYNTAX" = success ] && [ "$VOICE" = success ] && [ "$CACHE" = success ]; then
              echo "**CI VERDE — homologação física ainda obrigatória.**"
            else
              echo "**CI NÃO APROVADA — não publicar.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
