name: Validacao L2 ONE
on:
  push:
    branches: [main, feature/precos-uf-cliente]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  static-and-fiscal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências de teste
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar sintaxe Python
        run: python -m py_compile server.py speedio_integration.py commercial_tables.py access_policy.py seller_commission.py financial_visibility.py
      - name: Verificar sintaxe JavaScript
        run: |
          node --check app.js
          node --check cash.js
      - name: Testar regras fiscais
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Testar fluxos comerciais
        run: |
          node tests/test_commercial_workflow.cjs
          node tests/order_multibrand_ui.cjs
          node tests/commercial_tables_ui.cjs
          node tests/admin_seller_ui.cjs
