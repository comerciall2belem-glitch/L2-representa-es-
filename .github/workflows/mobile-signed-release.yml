name: L2 signed mobile artifacts
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        type: choice
        options: [preview-pilot, preview, production]
        default: preview-pilot
permissions:
  contents: read
jobs:
  signed-build:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || '2ff296d6-739f-43b7-a075-a2856f6ae57a' }}
      EXPO_OWNER: ${{ vars.EXPO_OWNER || 'comerciall2belems-team' }}
      EXPO_PROJECT_SLUG: ${{ vars.EXPO_PROJECT_SLUG || 'l2-one' }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      EXPO_PUBLIC_L2_API_URL: ${{ vars.L2_API_URL }}
      L2_BUILD_PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: python3 scripts/check_release_environment.py
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx --yes eas-cli@24.13.0 build --platform '${{ inputs.platform }}' --profile '${{ inputs.profile }}' --non-interactive --wait --json > signed-builds.json
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - run: python3 scripts/verify_signed_artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: L2-signed-${{ inputs.profile }}-${{ inputs.platform }}
          path: mobile/release-artifacts
          if-no-files-found: error
          retention-days: 30
