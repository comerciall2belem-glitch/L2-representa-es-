services:
  - type: web
    name: l2-one-pr99-homologacao
    runtime: python
    plan: free
    region: oregon
    branch: fix/fila-atendimentos
    autoDeployTrigger: off
    buildCommand: pip install -r requirements.txt
    startCommand: python -c "import os; assert os.environ['L2_EXPECTED_DATABASE'].strip()" && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: l2-one-pr99-db
          property: connectionString
      - key: L2_EXPECTED_DATABASE
        value: l2_one_pr99
      - key: L2_PASSWORD_1
        generateValue: true
      - key: L2_PASSWORD_2
        generateValue: true
      - key: L2_PASSWORD_3
        generateValue: true
      - key: L2_PASSWORD_4
        generateValue: true

databases:
  - name: l2-one-pr99-db
    databaseName: l2_one_pr99
    plan: free
    region: oregon
    ipAllowList: []
