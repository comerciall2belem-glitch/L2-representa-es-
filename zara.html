<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zara | L2 ONE</title><style>body{font:16px system-ui,sans-serif;background:#f6f7fa;color:#202b36;margin:0}header{background:#19304a;color:white;padding:18px}main{max-width:950px;margin:auto;padding:16px}button{border:0;border-radius:8px;background:#19304a;color:#fff;padding:10px 14px;margin:4px;cursor:pointer}button:disabled{opacity:.5}.row{padding:12px;margin:8px 0;background:white;border-radius:10px;cursor:pointer}.row.human{border-left:5px solid #c96143}.row.bot{border-left:5px solid #5c916f}#thread{background:white;border-radius:10px;min-height:150px;padding:16px;max-height:50vh;overflow:auto}.bubble{padding:9px 12px;border-radius:9px;background:#e9f0f4;margin:6px 0;white-space:pre-wrap}.bubble.out{background:#d9efdf;margin-left:12%}textarea{width:100%;min-height:75px;box-sizing:border-box;font:inherit;padding:10px}small{color:#566}</style>
<header><b>Zara · Atendimento WhatsApp</b></header><main><p id="status" role="status"></p><p>Homologação: receba a mensagem no aparelho de teste, use “Responder” no WhatsApp sobre essa mensagem e confira o retorno aqui. A aceitação pela Meta mantém a homologação pendente.</p><button id="refresh">Atualizar conversas</button><div id="list"></div><h2 id="title">Selecione uma conversa</h2><div id="thread"></div><div id="actions" hidden><button id="takeover">Assumir atendimento</button><button id="resume">Devolver à Zara</button><textarea id="reply" placeholder="Mensagem para o cliente"></textarea><button id="send">Enviar resposta</button></div></main>
<script>
const s=JSON.parse(localStorage.getItem('l2one_state_v2')||'{}'), status=document.querySelector('#status');let selected='',mode='',refreshing=false,openRevision=0;
const deliveryLabels={graph_accepted:'Aceita pela Meta · aguardando entrega',sent:'Enviada · aguardando entrega',delivered:'Entregue',read:'Lida',failed:'Falha de entrega',received:'Recebida'};
if(!s.token||s.user!=='Ana Paula'){document.querySelector('main').replaceChildren(document.createTextNode('Entre no L2 ONE como Ana Paula para acessar o atendimento.'));throw Error('Acesso necessário')}
async function api(path,method='GET',data){const r=await fetch('/api/zara/'+path,{method,headers:{Authorization:'Bearer '+s.token,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});const v=await r.json();if(!r.ok)throw Error(v.detail||'Falha na operação');return v}
function element(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
async function refresh(){
 if(refreshing)return;refreshing=true;
 try{
  const rows=await api('conversations'),list=document.querySelector('#list');list.replaceChildren();
  for(const row of rows){
   const e=element('div',(row.mode==='human'?'🔔 ':'')+(row.name||row.phone)+' · '+row.phone+' · '+(row.mode==='human'?'Aguardando equipe':'Zara atendendo'),'row '+row.mode);
   if(row.deliveryStatus)e.append(element('p',deliveryLabels[row.deliveryStatus]||row.deliveryStatus));
   e.append(element('small',row.lastMessage||''));
   e.append(element('p',row.e2eStatus==='confirmed'?'Teste E2E confirmado nesta conversa':'Homologação E2E pendente'));
   e.onclick=()=>open(row.phone,row.name,row.mode);list.append(e)
  }
  status.textContent=rows.filter(x=>x.mode==='human').length+' conversa(s) aguardando a equipe.';
  const current=rows.find(x=>x.phone===selected);if(current)await open(current.phone,current.name,current.mode);
 }catch(e){status.textContent=e.message}finally{refreshing=false}
}
async function open(phone,name,currentMode){
 selected=phone;mode=currentMode;const revision=++openRevision;
 document.querySelector('#title').textContent=(name||phone)+' · '+phone;
 document.querySelector('#actions').hidden=false;
 document.querySelector('#takeover').disabled=mode==='human';document.querySelector('#resume').disabled=mode==='bot';document.querySelector('#send').disabled=mode!=='human';
 try{
  const items=await api('conversations/'+encodeURIComponent(phone));if(revision!==openRevision||phone!==selected)return;
  const thread=document.querySelector('#thread');thread.replaceChildren();
  for(const item of items){
   const bubble=element('div',(item.direction==='out'?'L2: ':'Cliente: ')+item.body,'bubble '+item.direction);
   bubble.append(element('p',deliveryLabels[item.deliveryStatus]||item.deliveryStatus));
   if(item.direction==='out'){
    bubble.append(element('small',item.e2eStatus==='confirmed'?'Homologação E2E confirmada':item.e2eReady?'Entrega e retorno registrados · confira no painel':'Homologação pendente'));
    if(item.e2eReady&&item.e2eStatus!=='confirmed'){
     const button=element('button','Confirmar recebimento e retorno no painel');button.type='button';
     button.onclick=async()=>{button.disabled=true;try{await api('conversations/'+encodeURIComponent(phone)+'/messages/'+encodeURIComponent(item.id)+'/confirm-e2e','POST');await refresh()}catch(e){status.textContent=e.message;button.disabled=false}};
     bubble.append(button)
    }
   }
   thread.append(bubble)
  }
  thread.scrollTop=thread.scrollHeight;
 }catch(e){if(revision===openRevision)status.textContent=e.message}
}
async function change(action){if(!selected)return;try{await api('conversations/'+encodeURIComponent(selected)+'/'+action,'POST');await refresh();await open(selected,document.querySelector('#title').textContent.split(' · ')[0],action==='takeover'?'human':'bot')}catch(e){status.textContent=e.message}}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#takeover').onclick=()=>change('takeover');document.querySelector('#resume').onclick=()=>change('resume');document.querySelector('#send').onclick=async()=>{const field=document.querySelector('#reply');if(!field.value.trim())return;try{await api('conversations/'+encodeURIComponent(selected)+'/reply','POST',{text:field.value.trim()});field.value='';await open(selected,document.querySelector('#title').textContent.split(' · ')[0],'human')}catch(e){status.textContent=e.message}};refresh();setInterval(()=>{if(!document.hidden)refresh()},5000);
</script></html>
